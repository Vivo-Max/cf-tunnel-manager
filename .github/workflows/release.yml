name: Release cf-tunnel-manager

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 3.5 或 3.5.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY: cf-tunnel-manager

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: ver="${{ inputs.version }}"; ver="${ver#v}"; echo "tag=v${ver}" >> "$GITHUB_OUTPUT"; echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - name: Overwrite old release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.meta.outputs.tag }}" --yes || true; git push origin --delete "refs/tags/${{ steps.meta.outputs.tag }}" || true; git tag -f "${{ steps.meta.outputs.tag }}"; git push -f origin "refs/tags/${{ steps.meta.outputs.tag }}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: android, goarch: arm64, suffix: android-arm64 }
          - { goos: linux, goarch: amd64, suffix: linux-amd64 }
          - { goos: linux, goarch: arm64, suffix: linux-arm64 }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64 }
          - { goos: windows, goarch: amd64, suffix: windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: mkdir -p dist && go build -trimpath -ldflags="-s -w" -o "dist/${BINARY}-${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum cf-tunnel-manager-* > checksums.txt
      - name: Create/overwrite GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ env.BINARY }} ${{ needs.prepare.outputs.tag }}
          files: |
            dist/cf-tunnel-manager-*
            dist/checksums.txt
